name: Sunny Island WebBox
version: "0.5.3"
slug: webbox
description: >-
  Sunny Island WebBox RPC + Modbus parameter dashboard - live plant data,
  curated SI parameters, and Modbus TCP register read/write for SMA Sunny
  Island systems.
url: https://github.com/mobiletru/ha_addon_webbox
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: application
hassio_api: true
homeassistant_api: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: Sunny Island
watchdog: "http://[HOST]:[PORT:8099]/api/health"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web interface (only needed when not using Ingress)
map:
  - share:rw
  - config:rw
options:
  log_level: info
  scan_subnet: "192.168.100"
  cloudflare_tunnel_token: ""
  webboxes:
    - name: Sunny Island WebBox
      host: "192.168.100.180"
      password: "sma"
      installer_password: "sma"
      poll_interval: 30
      modbus_port: 502
      modbus_unit_id: 3
      modbus_profile: SI6048MBP
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  scan_subnet: str?
  cloudflare_tunnel_token: password?
  webboxes:
    - name: str
      host: str
      password: password?
      installer_password: password?
      poll_interval: int(5,3600)?
      public_url: url?
      modbus_port: int(1,65535)?
      modbus_unit_id: int(1,255)?
      modbus_profile: str?
